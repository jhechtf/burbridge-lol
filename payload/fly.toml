# fly.toml app configuration file for the Payload CMS server
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'burbridge-lol-payload'
primary_region = 'sjc'

[build]

[env]
  PORT = '3000'
  PAYLOAD_PUBLIC_SERVER_URL = 'https://burbridge-lol-payload.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
